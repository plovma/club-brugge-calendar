name: Generate calendar files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: generate-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Generate calendar files
        run: node generate-calendar.js

      - name: Check for calendar data changes
        shell: bash
        run: |
          if git diff --quiet -- calendar.html &&
            test -z "$(git ls-files --others --exclude-standard -- calendar.html)"; then
            echo "No calendar data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics calendar.html
          git commit -m "Update generated calendar"
          git push origin "HEAD:${GITHUB_REF_NAME}"
